name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.300"

      - run: dotnet restore Cohort.slnx

      - run: dotnet test Cohort.slnx -c Release --no-restore

      - name: Validate tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(dotnet msbuild Cohort/Cohort.csproj -getProperty:Version -nologo)"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version '$tag_version' does not match Cohort.csproj Version '$project_version'." >&2
            exit 1
          fi

      - name: Pack
        run: dotnet pack Cohort/Cohort.csproj -c Release --no-build --no-restore -o ./nupkgs

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
